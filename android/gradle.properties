org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
android.useAndroidX=true
android.enableJetifier=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# تفعيل التحسين الكامل لأداة R8 لتقليص الذاكرة والحجم وتسريع الإقلاع تلبية لمتطلبات Google Play
android.enableR8.fullMode=true

# منع فشل البناء عند التعامل مع مراجع الحزم المحذوفة
android.r8.failOnMissingClasses=false

# استقرار مترجم كوتلن
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx2048m