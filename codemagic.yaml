workflows:
  ios-release-ipa:
    name: Build Unsigned iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up dependencies
        script: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..

      - name: Build Flutter iOS App without Code Signing
        script: |
          flutter build ios --release --no-codesign

      - name: Package Runner.app into installable IPA
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -9 Wissal_App.ipa Payload
          cd ../../..

    artifacts:
      - build/ios/iphoneos/Wissal_App.ipa

    publishing:
      email:
        recipients:
          - zaidbelal222@gmail.com
        notify:
          success: true
          failure: true