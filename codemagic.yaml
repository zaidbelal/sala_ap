workflows:
  ios-release-ipa:
    name: Build Unsigned iOS IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up dependencies
        script: |
          flutter pub get
          cd ios && pod install --repo-update && cd ..

      - name: Build Unsigned Runner.app
        script: |
          flutter build ios --release --no-codesign --config-only
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/ios_derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package Runner.app into installable IPA
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r -9 Wissal_App.ipa Payload
          cd ../../..

    artifacts:
      - build/ios/iphoneos/Wissal_App.ipa

    publishing:
      email:
        recipients:
          - zaidbelal222@gmail.com
        notify:
          success: true
          failure: true